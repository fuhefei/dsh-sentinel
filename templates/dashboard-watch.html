<tr>
  <td>{{session}}… <small>{{live}}</small>{{#dropped}}{{> badge}}{{/dropped}}</td>
  <td>{{id}}</td>
  <td>{{kind}}</td>
  <td class="target" title="{{note}}">{{target}}</td>
  <td>{{#patternView}}{{> pattern}}{{/patternView}}{{^patternView}}—{{/patternView}}</td>
  <td>{{fireCount}}/{{maxFires}}{{#pending}}{{> badge}}{{/pending}}</td>
  <td>{{state}}</td>
  <td>{{next}}</td>
  <td><button type="button" class="cancel" data-session="{{sessionId}}" data-id="{{id}}" title="{{cancel}}" aria-label="{{cancel}} {{id}}">×</button></td>
</tr>
